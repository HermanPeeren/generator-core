name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      # v5 is v4 on the node24 runtime. v4 declares node20, which GitHub
      # deprecated in September 2025; the runners warn and use node24 anyway.
      - uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Unit tests
        run: composer test

      - name: Static analysis
        run: composer analyse

      - name: Coding standards
        run: composer cs
