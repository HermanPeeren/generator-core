name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      # v5 is v4 on the node24 runtime. v4 declares node20, which GitHub
      # deprecated in September 2025; the runners warn and use node24 anyway.
      - uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # The browser tests use node:test and nothing else, so there is
          # nothing to install - but the version is pinned rather than left to
          # whatever the runner image happens to ship.
          node-version: '20'

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Unit tests
        run: composer test

      - name: Browser-side tests
        run: composer test-js

      - name: Fetch Joomla as reference material
        # `src/Joomla` extends Joomla's FormField, so the analyser needs the
        # class. `src/Core` neither imports it nor may; the suite says so.
        # /joomla is git-ignored, so CI fetches its own.
        env:
          JOOMLA_VERSION: 6.0.0
        run: |
          url="https://github.com/joomla/joomla-cms/releases/download/${JOOMLA_VERSION}/Joomla_${JOOMLA_VERSION}-Stable-Full_Package.tar.gz"
          curl -sSL -o joomla.tar.gz "$url"
          mkdir -p joomla
          tar -xzf joomla.tar.gz -C joomla

      - name: Static analysis
        run: composer analyse

      - name: Coding standards
        run: composer cs
